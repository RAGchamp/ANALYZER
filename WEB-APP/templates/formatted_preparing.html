<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preparing the formatted document</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body{ background:#f7f8fa; }
  .topnav{ background:#0a1128; color:#f2b400; padding:.9rem 1.5rem; display:flex; justify-content:space-between; align-items:center; }
  .topnav .brand svg{ height:42px; width:auto; display:block; }
  .topnav .tagline{ font-weight:600; letter-spacing:.15em; word-spacing:.6em; font-style:italic; }
</style>
</head>
<body>
<div class="topnav">
  <span class="brand" aria-label="RAG Champ">{{ logo_svg | safe }}</span>
  <div class="tagline">ANNUAL REPORT ANALYZER</div>
</div>
<main class="container my-5" style="max-width:720px">
  <div class="card shadow-sm">
    <div class="card-body">
      <h1 class="h4">Preparing the formatted document</h1>
      <p class="text-muted mb-3">{{ doc_name }} has not been ingested yet (or its package is out of date).
        The first time takes 15 s – 1.5 min; after that the document opens at once.</p>
      <div class="d-flex align-items-center gap-2" id="progress">
        <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
        <span id="status">Ingesting…</span>
      </div>
      <div id="error" class="alert alert-danger mt-3 d-none" role="alert"></div>
    </div>
  </div>
</main>
<script>
(async function () {
  const doc = {{ doc_name | tojson }};
  const status = document.getElementById("status");
  const started = Date.now();
  function fail(message) {
    document.getElementById("progress").classList.add("d-none");
    const box = document.getElementById("error");
    box.textContent = message;
    box.classList.remove("d-none");
  }
  try {
    const res = await fetch("/api/model-testing/formatted/prepare", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ doc }) });
    const data = await res.json();
    if (!res.ok) return fail(data.error || `Request failed (${res.status})`);
    for (;;) {
      await new Promise((r) => setTimeout(r, 1000));
      const job = await (await fetch(`/api/jobs/${data.job_id}`)).json();
      if (job.status === "done") break;
      if (job.status === "error") return fail(job.error);
      status.textContent = `Ingesting… (${Math.round((Date.now() - started) / 1000)}s)`;
    }
    const url = new URL(location.href);
    url.searchParams.set("prepared", "1");
    location.replace(url.toString());
  } catch (err) {
    fail(err.message);
  }
})();
</script>
</body>
</html>
